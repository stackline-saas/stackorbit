# ==============================================================================
# CONFIGURAÇÃO ESTÁTICA DO TRAEFIK (traefik.yml)
# Modo de Operação: File Provider Dinâmico + Cloudflare Origin CA
# ==============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

api:
  dashboard: true
  insecure: false
