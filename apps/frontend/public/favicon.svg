<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="stack-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="stack-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="stack-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#090D16" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#orbit-grad)" stroke-width="6" stroke-opacity="0.25" fill="none" />

  <!-- Orbit Ring 1 (Back) -->
  <ellipse cx="256" cy="256" rx="200" ry="70" transform="rotate(-30 256 256)" stroke="url(#orbit-grad)" stroke-width="14" stroke-dasharray="14 10" stroke-opacity="0.4" fill="none" />

  <!-- Stack Layers (Isometric) -->
  <g filter="url(#glow)">
    <!-- Layer 3: Bottom Layer -->
    <path d="M 256 310 L 360 255 L 256 200 L 152 255 Z" fill="url(#stack-bot)" opacity="0.9" />
    <path d="M 152 255 L 256 310 L 256 340 L 152 285 Z" fill="#581C87" />
    <path d="M 256 310 L 360 255 L 360 285 L 256 340 Z" fill="#6B21A8" />

    <!-- Layer 2: Middle Layer -->
    <path d="M 256 240 L 360 185 L 256 130 L 152 185 Z" fill="url(#stack-mid)" opacity="0.95" />
    <path d="M 152 185 L 256 240 L 256 265 L 152 210 Z" fill="#3730A3" />
    <path d="M 256 240 L 360 185 L 360 210 L 256 265 Z" fill="#4338CA" />

    <!-- Layer 1: Top Layer -->
    <path d="M 256 170 L 360 115 L 256 60 L 152 115 Z" fill="url(#stack-top)" />
    <path d="M 152 115 L 256 170 L 256 195 L 152 140 Z" fill="#0369A1" />
    <path d="M 256 170 L 360 115 L 360 140 L 256 195 Z" fill="#0284C7" />
  </g>

  <!-- Orbit Ring 2 (Front) -->
  <path d="M 90 345 C 150 420 360 410 422 280" stroke="url(#orbit-grad)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Orbiting Node (Satellite) -->
  <circle cx="420" cy="275" r="22" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="420" cy="275" r="12" fill="#FFFFFF" />
  
  <!-- Counter-orbit mini node -->
  <circle cx="100" cy="330" r="14" fill="#A855F7" filter="url(#glow)" />
  <circle cx="100" cy="330" r="7" fill="#FFFFFF" />
</svg>
