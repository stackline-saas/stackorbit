name: CI - Verificação Contínua

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-build:
    name: Lint, Testes e Monorepo Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Habilitar pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate

      - name: 🚚 Instalar Dependências
        run: pnpm install --frozen-lockfile=false

      - name: 🗄️ Gerar Prisma Client
        run: pnpm --filter @stackorbit/database prisma:generate

      - name: 🏗️ Executar Monorepo Build
        run: pnpm build
